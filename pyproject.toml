[project]
name = "primitive-db"
version = "0.1.1"
description = "Primitive console database"
readme = "README.md"
authors = [
    { name = "Nikolay Solovey", email = "soloveynikolay2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
